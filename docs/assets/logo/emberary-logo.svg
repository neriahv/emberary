<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104">
  <title>Emberary</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="68%" r="62%">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.45" stop-color="#ffc25a"/>
      <stop offset="0.8" stop-color="#f58a3a"/>
      <stop offset="1" stop-color="#e2602a"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0532a"/>
      <stop offset="1" stop-color="#8f3418"/>
    </linearGradient>
  </defs>

  <!-- firelight -->
  <ellipse cx="60" cy="46" rx="46" ry="40" fill="url(#glow)"/>

  <!-- the book's cover, with gold borders and stars -->
  <path d="M8 60 Q34 66 52 74 L52 92 Q32 86 13 84 Z" fill="url(#cover)" stroke="#6b2412" stroke-width="2" stroke-linejoin="round"/>
  <path d="M112 60 Q86 66 68 74 L68 92 Q88 86 107 84 Z" fill="url(#cover)" stroke="#6b2412" stroke-width="2" stroke-linejoin="round"/>
  <path d="M14 66 Q33 71 47 78 L47 86 Q31 81 17 79 Z" fill="none" stroke="#e7b45a" stroke-width="1.2" opacity="0.85"/>
  <path d="M106 66 Q87 71 73 78 L73 86 Q89 81 103 79 Z" fill="none" stroke="#e7b45a" stroke-width="1.2" opacity="0.85"/>
  <path d="M30 74 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6z" fill="#f2c46a"/>
  <path d="M90 74 l1.6 3.4 3.4 1.6 -3.4 1.6 -1.6 3.4 -1.6 -3.4 -3.4 -1.6 3.4 -1.6z" fill="#f2c46a"/>
  <!-- the spine -->
  <path d="M50 72 Q60 76 70 72 L70 94 Q60 98 50 94 Z" fill="#a8401d" stroke="#6b2412" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 80 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4z" fill="#f2c46a"/>

  <!-- the pages, fanned open, flaring out either side of the flame -->
  <path d="M7 62 Q9 44 22 38 Q40 32 58 70 Q44 60 30 60 Q16 60 7 66 Z" fill="#fff4de" stroke="#d9b98a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M113 62 Q111 44 98 38 Q80 32 62 70 Q76 60 90 60 Q104 60 113 66 Z" fill="#fff4de" stroke="#d9b98a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M11 56 Q20 44 36 46 M12 61 Q24 52 44 56 M109 56 Q100 44 84 46 M108 61 Q96 52 76 56" fill="none" stroke="#e6cfa6" stroke-width="1.2"/>

  <!-- the flame, smiling -->
  <path d="M60 6 C64 16 72 20 72 30 C76 26 80 30 79 36 C84 34 86 42 82 50 C79 60 71 68 60 70 C49 68 41 60 38 50 C34 42 36 34 41 36 C40 30 44 26 48 30 C48 22 56 16 60 6 Z"
        fill="url(#flame)" stroke="#d2541f" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="53.5" cy="47" rx="3.2" ry="3.8" fill="#3a1d12"/>
  <ellipse cx="66.5" cy="47" rx="3.2" ry="3.8" fill="#3a1d12"/>
  <circle cx="54.6" cy="45.6" r="1.1" fill="#fff"/>
  <circle cx="67.6" cy="45.6" r="1.1" fill="#fff"/>
  <path d="M56.5 53.5 Q60 57 63.5 53.5" fill="none" stroke="#3a1d12" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="48.5" cy="53" rx="3" ry="1.8" fill="#f07a4a" opacity="0.55"/>
  <ellipse cx="71.5" cy="53" rx="3" ry="1.8" fill="#f07a4a" opacity="0.55"/>

  <!-- drifting sparks -->
  <path d="M28 22 c2 3 4 5 2 8 c-2 2 -6 1 -5 -3 c0 -2 2 -3 3 -5z" fill="#ff9c45"/>
  <path d="M93 14 c2 3 4 5 2 8 c-2 2 -6 1 -5 -3 c0 -2 2 -3 3 -5z" fill="#ff9c45"/>
  <path d="M99 32 c1.6 2.4 3 4 1.6 6.4 c-1.6 1.6 -4.8 .8 -4 -2.4 c0 -1.6 1.6 -2.4 2.4 -4z" fill="#ffb05a"/>
</svg>
